<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f2742">
<title>西天満 つきや｜予約管理</title>
<style>
:root{--navy:#0f2742;--gold:#b28a47;--line:#e7e1d7;--muted:#697484;--bg:#f5f3ee}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#1d2430;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
header{background:var(--navy);color:white;padding:17px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:20px;font-weight:800}.sub{font-size:11px;opacity:.75}
main{max-width:1450px;margin:auto;padding:16px}.pages{display:flex;gap:8px;margin-bottom:14px}.pages a{padding:11px 18px;border-radius:10px;text-decoration:none;background:white;color:var(--navy);border:1px solid var(--line);font-weight:800}.pages a.active{background:var(--navy);color:white}
.card{background:white;border:1px solid var(--line);border-radius:15px;padding:16px;margin-bottom:14px}h1{font-size:20px;color:var(--navy);margin:0}h2{font-size:17px;color:var(--navy);margin:0 0 12px}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}button{border:1px solid var(--line);border-radius:9px;background:white;color:var(--navy);font-weight:800;padding:10px 13px;cursor:pointer}input[type=date]{padding:9px;border:1px solid var(--line);border-radius:9px;font-size:15px;background:white}label,.hint{font-size:12px;color:var(--muted)}.hint{margin:10px 0 0;line-height:1.5}
.board-scroll{overflow-x:auto;padding-bottom:3px}.counter-scroll{overflow-x:visible}.matrix{display:grid;gap:6px;min-width:830px}.counter{min-width:0;grid-template-columns:48px repeat(8,minmax(0,1fr));gap:3px}.counter .head,.counter .time{padding:7px 1px;font-size:11px}.counter .seat{padding:5px;min-height:95px}.counter .seat .name{font-size:11px}.counter .seat .meta,.counter .seat .badge{font-size:10px}.rooms{grid-template-columns:86px repeat(3,minmax(170px,1fr));min-width:620px}.head,.time{background:#edf0f4;color:var(--navy);border-radius:8px;padding:9px;text-align:center;font-size:12px;font-weight:800}.time{display:flex;align-items:center;justify-content:center;position:sticky;left:0;z-index:1;background:var(--navy);color:white}
.seat{min-height:106px;border:1px solid var(--line);border-radius:10px;background:#faf9f6;padding:9px;overflow-wrap:anywhere}.seat.busy{background:#fff;border-color:#cbb890}.seat .name{font-size:13px;font-weight:800;color:var(--navy);line-height:1.35}.seat .meta{font-size:11px;color:var(--muted);margin-top:5px}.badge{display:inline-block;margin-top:7px;padding:4px 6px;border-radius:7px;font-size:11px;font-weight:800;background:#eee}.badge.CONFIRMED{background:#e4f4ec;color:#1f7a5a}.badge.INVOICED{background:#fff0da;color:#9a6213}.badge.ERROR{background:#fde7e7;color:#a63d40}.empty{font-size:12px;color:#8a9098}.summary{font-size:12px;color:var(--muted);margin:0 0 12px}.newbadge{background:#bb3434;color:white;border-radius:999px;padding:2px 7px;font-size:11px}.top-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,390px);gap:14px;align-items:start}.formgrid{display:grid;grid-template-columns:1fr;gap:9px}.formgrid input[readonly]{background:#f1f1ef;color:#353d48}.phone-card{position:sticky;top:12px}.phone-card button[disabled]{opacity:.45;cursor:not-allowed}.formgrid label{display:block;margin-bottom:5px}.formgrid input,.formgrid select{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;font-size:14px}.alert{background:#fff0da;border:1px solid #dfb16c;border-radius:10px;padding:12px;margin-bottom:14px}.alert[hidden],.newbadge[hidden],.suggestions[hidden]{display:none}.suggestions{margin-top:10px;padding:10px;background:#f5f3ee;border-radius:9px}.suggestions button{margin:4px}.new-grid{display:grid;gap:10px;margin-top:12px}.new-item{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fffdf9}.new-item strong{color:var(--navy)}.new-item p{font-size:13px;line-height:1.6;margin:8px 0}.online-layout{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(250px,.8fr);gap:14px;margin-top:12px}.online-detail{background:#f7f5f0;border:1px solid var(--line);border-radius:10px;padding:13px;font-size:13px;line-height:1.6;overflow-wrap:anywhere}.online-detail dl{display:grid;grid-template-columns:85px 1fr;margin:6px 0}.online-detail dt{color:var(--muted)}.online-detail dd{margin:0}.online-list tr{cursor:pointer}.online-list tr:hover,.online-list tr.selected{background:#f4eee2}@media(max-width:750px){.online-layout{grid-template-columns:1fr}}.list-scroll{overflow:auto;max-height:55vh}.list-scroll table{border-collapse:collapse;width:100%;min-width:650px}.list-scroll th,.list-scroll td{border-bottom:1px solid var(--line);padding:9px;text-align:left;font-size:12px}
@media(max-width:900px){.top-layout{grid-template-columns:1fr}.phone-card{position:static}}@media(max-width:550px){header{padding:13px}.brand{font-size:16px}main{padding:10px}.card{padding:12px}.pages a{flex:1;text-align:center}.counter{grid-template-columns:43px repeat(8,minmax(0,1fr));min-width:0;gap:2px}.counter .seat{padding:3px;min-height:88px}.counter .seat .name{font-size:10px}.counter .seat .meta,.counter .seat .badge{font-size:9px}.rooms{min-width:620px}}
</style>
</head>
<body>
<header><div><div class="brand">西天満 つきや｜予約管理</div><div class="sub">カウンター8席・個室3室 / 2部制</div></div><button onclick="logout()">ログアウト</button></header>
<main>
<nav class="pages" aria-label="管理画面"><a href="/">決済管理</a><a class="active" href="/reservations">予約管理 <span id="reservationBadge" class="newbadge" hidden></span></a></nav>
<div id="newAlert" class="alert" role="status" hidden><span id="newMessage"></span> <button onclick="showNewReservations()">新規予約を見る</button></div>
<div class="top-layout"><div class="board-main"><section class="card"><div class="toolbar"><h1>日別予約表</h1><label for="day">来店日</label><input id="day" type="date" onchange="syncFromBoard()"><button onclick="load()">予約・決済状態を更新</button><button onclick="showOnline()">オンライン</button></div><p class="hint" id="status">読み込み中</p></section>
<section class="card"><h2>カウンター 8席</h2><p class="summary" id="counterSummary"></p><div class="board-scroll counter-scroll"><div id="counter" class="matrix counter"></div></div><p class="hint">右端が1番、左端が8番です。席番号は人数に応じた画面上の自動配置です。</p></section>
<section class="card"><h2>個室 3室</h2><p class="summary" id="roomSummary"></p><div class="board-scroll"><div id="rooms" class="matrix rooms"></div></div></section>
</div>
<section class="card phone-card" id="phoneCard"><h2>電話予約入力</h2><div class="formgrid">
<div><label for="visitDate">来店日</label><input id="visitDate" type="date" onchange="syncFromForm()"></div>
<div><label for="visitTime">時刻</label><select id="visitTime" onchange="checkAvailability()"><option value="18:00">18:00（1部）</option><option value="20:30">20:30（2部）</option></select></div>
<div><label for="party">人数</label><input id="party" type="number" min="1" max="20" value="2" oninput="checkAvailability()"></div>
<div><label for="area">席</label><select id="area" onchange="checkAvailability()"><option value="COUNTER">カウンター</option><option value="PRIVATE1">個室1</option><option value="PRIVATE2">個室2</option><option value="PRIVATE3">個室3</option></select></div>
<div><label for="name">名前</label><input id="name"></div>
<div><label for="phone">電話番号</label><input id="phone" type="tel"></div>
<div><label for="course">コース（自動設定）</label><input id="course" readonly></div>
<div><label for="amount">前受け金額（人数分・税込）</label><input id="amount" readonly></div>
</div><p id="availability" class="hint"></p><div id="suggestions" class="suggestions" hidden></div><div class="toolbar"><button id="submitPhone" onclick="addReservation()" disabled>予約登録</button></div><p id="notice" class="hint">登録時に残席を再確認します。</p></section>
</div>
<section class="card" id="newReservations" hidden><div class="toolbar"><h2>新規予約</h2><button onclick="load()">更新</button></div><div id="newRows" class="new-grid"></div></section>
<section class="card" id="onlineList" hidden><div class="toolbar"><h2>オンライン</h2><button onclick="load()">更新</button></div><div class="online-layout"><div class="list-scroll online-list"><table><thead><tr><th>受付日</th><th>予約日時</th><th>予約サイト</th><th>経路</th><th>ステータス</th></tr></thead><tbody id="onlineRows"></tbody></table></div><aside id="onlineDetail" class="online-detail" aria-live="polite">オンライン予約を選択してください。</aside></div><p class="hint">Square請求と入金確認は「決済管理」から操作できます。</p></section>
<p class="hint">実際の席割りを確定する機能はまだありません。</p>
</main>
<script>
const $=id=>document.getElementById(id);
let reservations=[],unpaid=[];
const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
function paymentLabel(r){if(r.status==='CONFIRMED')return r.payment_source==='BANK'?'銀行入金済':r.payment_source==='SQUARE'?'Square決済済':'予約確定';if(r.status==='INVOICED'){const invoice=unpaid.find(x=>Number(x.id)===Number(r.id));return invoice?`Square ${invoice.square_status==='UNPAID'?'未決済':escapeHtml(invoice.square_status)}`:'Square請求済'}return ({PENDING:'請求前',ERROR:'要確認'}[r.status]||escapeHtml(r.status))}
function seat(r){if(!r)return '<div class="seat empty">空き</div>';return `<div class="seat busy"><div class="name">${escapeHtml(r.guest_name)}</div><div class="meta">${escapeHtml(r.party_size)}名 · ¥${Number(r.amount||0).toLocaleString()}</div><span class="badge ${escapeHtml(r.status)}">${paymentLabel(r)}</span></div>`}
function slotRows(day,time,area){return reservations.filter(r=>r.status!=='CANCELLED'&&String(r.visit_at||'').slice(0,10)===day&&String(r.visit_at||'').slice(11,16)===time&&r.seating_area===area).sort((a,b)=>Number(a.id)-Number(b.id))}
function render(){const day=$('day').value;if(!day)return;const times=['18:00','20:30'];let counter='<div class="head">時間</div>'+Array.from({length:8},(_,i)=>`<div class="head">${8-i}番</div>`).join('');let rooms='<div class="head">時間</div>'+Array.from({length:3},(_,i)=>`<div class="head">個室${i+1}</div>`).join('');const counterCounts=[],roomCounts=[];for(const time of times){const people=slotRows(day,time,'COUNTER');const seats=Array(8).fill(null);for(const r of people){let n=Math.max(1,Number(r.party_size)||1);for(let i=0;i<8&&n;i++)if(!seats[i]){seats[i]=r;n--}}counterCounts.push(seats.filter(Boolean).length);counter+=`<div class="time">${time}</div>`+seats.reverse().map(seat).join('');const roomRows=[1,2,3].map(i=>slotRows(day,time,`PRIVATE${i}`)[0]||null);roomCounts.push(roomRows.filter(Boolean).length);rooms+=`<div class="time">${time}</div>`+roomRows.map(seat).join('')}
$('counter').innerHTML=counter;$('rooms').innerHTML=rooms;$('counterSummary').textContent=`前半 ${counterCounts[0]}/8席 · 後半 ${counterCounts[1]}/8席`;$('roomSummary').textContent=`前半 ${roomCounts[0]}/3室 · 後半 ${roomCounts[1]}/3室`}
async function api(path,opt={}){const response=await fetch(path,{...opt,headers:opt.body?{'Content-Type':'application/json'}:{},credentials:'same-origin'});if(response.status===401){location.href='/login';throw Error('再ログインしてください')}let result={};try{result=await response.json()}catch(e){}if(!response.ok)throw Error(result.error||`HTTP ${response.status}`);return result}
async function load(){try{reservations=await api('/api/reservations');try{unpaid=await api('/api/unpaid-invoices');$('status').textContent='予約とSquareの決済状態を更新しました'}catch(e){unpaid=[];$('status').textContent='予約を表示中。Squareの現在状態は取得できませんでした'}render();renderNotifications();renderNewReservations();renderOnline();checkAvailability()}catch(e){$('status').textContent=`予約を取得できません：${e.message}`}}

function showNewReservations(){$('newReservations').hidden=false;renderNewReservations();$('newReservations').scrollIntoView({behavior:'smooth',block:'start'})}
function showOnline(){$('onlineList').hidden=false;renderOnline();$('onlineList').scrollIntoView({behavior:'smooth',block:'start'})}
function areaLabel(r){return r.seating_area==='COUNTER'?'カウンター':({PRIVATE1:'個室1',PRIVATE2:'個室2',PRIVATE3:'個室3',UNASSIGNED:'未割当'}[r.seating_area]||'席未指定')}
function sourceLabel(r){return ({WEB:'オンライン',PHONE:'電話',SQUARE:'Square'}[r.source]||'その他')}
function statusLabel(r){return ({PENDING:'決済待ち',INVOICED:'請求済み・未決済',CONFIRMED:'予約確定',CANCELLED:'キャンセル',ERROR:'要確認'}[r.status]||'要確認')}
function yen(n){return `¥${Number(n||0).toLocaleString()}`}
function receivedAt(value){const d=new Date(value);return Number.isNaN(d.getTime())?'—':d.toLocaleString('ja-JP',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}
function renderNotifications(){const n=reservations.filter(r=>!r.staff_seen_at).length;$('reservationBadge').hidden=!n;$('reservationBadge').textContent=n;$('newAlert').hidden=!n;$('newMessage').textContent=`新しい予約が${n}件あります。`}
function renderNewReservations(){const unseen=reservations.filter(r=>!r.staff_seen_at).sort((a,b)=>Number(b.id)-Number(a.id));$('newRows').innerHTML=unseen.length?unseen.map(r=>`<div class="new-item"><strong>新規予約 #${Number(r.id)}　${escapeHtml(r.guest_name)}</strong><p>受付：${escapeHtml(receivedAt(r.created_at))}<br>来店：${escapeHtml(String(r.visit_at||'').replace('T',' '))}　${escapeHtml(areaLabel(r))}　${Number(r.party_size)}名<br>経路：${escapeHtml(sourceLabel(r))}　状況：${escapeHtml(statusLabel(r))}<br>コース：${escapeHtml(r.course_name||'—')}　${yen(r.amount)}<br>連絡先：${escapeHtml(r.phone||'—')} ／ ${escapeHtml(r.email||'—')}</p><button onclick="markRead(${Number(r.id)})">この予約を既読にする</button></div>`).join(''):'新規予約はありません。'}
async function markRead(id){try{await api('/api/reservations/mark-read',{method:'POST',body:JSON.stringify({ids:[id]})});await load()}catch(e){$('status').textContent=e.message}}
let selectedOnlineId=null;
function renderOnline(){const rows=reservations.filter(r=>r.source==='WEB').sort((a,b)=>Number(b.id)-Number(a.id));$('onlineRows').innerHTML=rows.length?rows.map(r=>`<tr class="${Number(r.id)===selectedOnlineId?'selected':''}" onclick="showOnlineDetail(${Number(r.id)})"><td>${escapeHtml(receivedAt(r.created_at))}</td><td>${escapeHtml(String(r.visit_at||'').replace('T',' '))}</td><td>つきやホームページ</td><td>${escapeHtml(sourceLabel(r))}</td><td>${escapeHtml(statusLabel(r))}</td></tr>`).join(''):'<tr><td colspan="5">オンライン予約はありません。</td></tr>';if(rows.length){if(!rows.some(r=>Number(r.id)===selectedOnlineId))selectedOnlineId=Number(rows[0].id);showOnlineDetail(selectedOnlineId)}else{$('onlineDetail').textContent='オンライン予約はありません。'}}
function showOnlineDetail(id){const r=reservations.find(x=>Number(x.id)===id&&x.source==='WEB');if(!r)return;selectedOnlineId=id;for(const row of $('onlineRows').rows){row.classList.toggle('selected',Number(row.getAttribute('onclick')?.match(/\d+/)?.[0])===id)}const fields=[['予約ID',`#${Number(r.id)}`],['受付日',receivedAt(r.created_at)],['予約日時',String(r.visit_at||'').replace('T',' ')],['予約サイト','つきやホームページ'],['経路',sourceLabel(r)],['状況',statusLabel(r)],['お客様',r.guest_name],['席',areaLabel(r)],['人数',`${Number(r.party_size)}名`],['コース',r.course_name||'—'],['お料理代',yen(r.amount)],['電話番号',r.phone||'—'],['メール',r.email||'—']];$('onlineDetail').innerHTML='<h3>予約詳細</h3><dl>'+fields.map(([name,value])=>`<dt>${escapeHtml(name)}</dt><dd>${escapeHtml(value)}</dd>`).join('')+'</dl>'}
function syncFromBoard(){$('visitDate').value=$('day').value;render();checkAvailability()}
function syncFromForm(){$('day').value=$('visitDate').value;render();checkAvailability()}
let availabilitySeq=0,courseSeq=0;
async function checkAvailability(){const seq=++availabilitySeq;const date=$('visitDate').value,party=Number($('party').value);$('suggestions').hidden=true;updateCourse();if(!date||party<1)return;const at=`${date}T${$('visitTime').value}`;const q=new URLSearchParams({visit_at:at,seating_area:$('area').value,party_size:party,counter_round:$('area').value==='COUNTER'?($('visitTime').value==='18:00'?'1':'2'):''});try{const result=await api('/api/availability?'+q);if(seq!==availabilitySeq)return;$('availability').textContent=result.available?'ご希望の席に空きがあります。':`満席・予約不可：${result.message}`;if(!result.available){const suggestions=result.suggestions||[];$('suggestions').hidden=false;$('suggestions').innerHTML=suggestions.length?'近くの空席候補：'+suggestions.map((s,i)=>`<button onclick="chooseSuggestion(${i})">${escapeHtml(s.visit_at.replace('T',' '))}　${s.seating_area==='COUNTER'?'カウンター':`個室${s.seating_area.slice(-1)}`}</button>`).join(''):'現在ご案内できる近くの候補はありません。';window.currentSuggestions=suggestions}}catch(e){if(seq===availabilitySeq)$('availability').textContent=`空席確認に失敗しました：${e.message}`}}

async function updateCourse(){const seq=++courseSeq,date=$('visitDate').value,party=Number($('party').value);$('course').value='';$('amount').value='';$('submitPhone').disabled=true;if(!date||party<1)return;try{const q=new URLSearchParams({date,party_size:party});const result=await api('/api/phone-course?'+q);if(seq!==courseSeq)return;if(result.available){$('course').value=result.course_name;$('amount').value=`¥${Number(result.amount).toLocaleString()}`;$('submitPhone').disabled=false}else{$('course').value='予約可能なコースはありません'}}catch(e){if(seq===courseSeq)$('course').value=e.message}}

function chooseSuggestion(i){const s=(window.currentSuggestions||[])[i];if(!s)return;$('visitDate').value=s.visit_at.slice(0,10);$('visitTime').value=s.visit_at.slice(11,16);$('area').value=s.seating_area;syncFromForm();$('phoneCard').scrollIntoView({behavior:'smooth',block:'start'})}
async function addReservation(){const body={guest_name:$('name').value.trim(),phone:$('phone').value.trim(),party_size:Number($('party').value),visit_at:`${$('visitDate').value}T${$('visitTime').value}`,seating_area:$('area').value,counter_round:$('area').value==='COUNTER'?($('visitTime').value==='18:00'?1:2):null,duration_minutes:150};try{const r=await api('/api/reservations/phone',{method:'POST',body:JSON.stringify(body)});$('notice').textContent=`${r.guest_name}様を登録しました。決済管理からSquare請求を送ってください。`;for(const id of ['name','phone'])$(id).value='';await load()}catch(e){$('notice').textContent=e.message;checkAvailability()}}

async function logout(){await fetch('/api/logout',{method:'POST',credentials:'same-origin'});location.href='/login'}
const today=new Date();$('day').value=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;$('visitDate').value=$('day').value;load();
</script>
</body>
</html>
