<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>つきや LINE通知</title><style>body{font:16px sans-serif;max-width:620px;margin:40px auto;padding:20px;color:#142339}button{display:block;padding:18px;margin:16px 0;width:100%;font:inherit}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><h1>LINE予約通知</h1><p><a href="/line-reservations">LINEからの予約登録・写真確認</a></p><p><a href="/concierge">VIPコンシェルジュ管理</a> ／ <a href="/reservations">予約管理</a></p><p>毎朝9時に、予約表の画像とケーキ・花束のリクエストを業務グループへ送ります。</p><p>最初にテスト送信を押し、グループに画像が届いたことを確認してから自動配信を開始してください。テストは本日の予約情報を送信します。同じ日の再送は行いません。</p><button onclick="action('test')">本日の予約表をテスト送信</button><button onclick="action('enable')">毎朝9時の自動配信を開始</button><button onclick="action('disable')">自動配信を停止</button><section style="border:1px solid #c9ced5;border-radius:10px;padding:16px;margin:20px 0"><h2>従業員AI｜接続診断</h2><p>GPTへの接続とLINE返信を区別して記録します。質問内容・スタッフIDは保存しません。</p><pre id="staffFaq">確認中…</pre><button onclick="refresh()">診断を更新</button></section><pre id="state">確認中…</pre><script>async function refresh(){const r=await fetch('/api/line/status');if(r.status===401){location.href='/login';return}const x=await r.json();const f=x.staff_faq||{};const latest=f.latest||{};const detail=k=>{const s=latest[k];return s?(s.outcome+'（UTC '+s.checked_at_utc+'／計'+s.total+'回）'):'まだ診断結果なし'};document.getElementById('staffFaq').textContent='GPT APIキー設定：'+(f.openai_key_configured?'あり':'なし')+'\\nモデル：'+(f.model||'不明')+'\\nGPT応答：'+detail('openai')+'\\nLINEへの返信：'+detail('line_reply')+'\\nスタッフ在籍確認：'+detail('authorization')+'\\n※成功と表示されても、対象者のLINE画面への到達は別途確認が必要です。';document.getElementById('state').textContent='自動配信：'+(x.delivery_enabled?'有効':'停止中')+'\n配信時刻：毎朝9時（日本時間）'+'\n伝票写真の転送：'+(x.receipt_import_enabled?'接続済み':'未接続')+'\n写真の転送履歴：'+JSON.stringify(x.receipt_relay)+'\n'+(x.receipt_relay_error||'')+'\n'+JSON.stringify(x.deliveries,null,2)}async function action(a){document.querySelectorAll('button').forEach(b=>b.disabled=true);try{const r=await fetch('/api/line/'+a,{method:'POST',headers:{'X-Tsukiya-Action':'line-settings'}});const x=await r.json();if(!r.ok)alert(x.error);await refresh()}catch(e){alert('通信結果を確認できません。再読み込みして送信履歴をご確認ください。')}finally{document.querySelectorAll('button').forEach(b=>b.disabled=false)}}refresh()</script></html>
