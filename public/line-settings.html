<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>つきや LINE通知</title><style>body{font:16px sans-serif;max-width:620px;margin:40px auto;padding:20px;color:#142339}button{display:block;padding:18px;margin:16px 0;width:100%;font:inherit}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><h1>LINE予約通知</h1><p><a href="/concierge">VIPコンシェルジュ管理</a> ／ <a href="/reservations">予約管理</a></p><p>毎朝9時に、予約表の画像とケーキ・花束のリクエストを業務グループへ送ります。</p><p>最初にテスト送信を押し、グループに画像が届いたことを確認してから自動配信を開始してください。テストは本日の予約情報を送信します。同じ日の再送は行いません。</p><button onclick="action('test')">本日の予約表をテスト送信</button><button onclick="action('enable')">毎朝9時の自動配信を開始</button><button onclick="action('disable')">自動配信を停止</button><pre id="state">確認中…</pre><script>async function refresh(){const r=await fetch('/api/line/status');if(r.status===401){location.href='/login';return}const x=await r.json();document.getElementById('state').textContent='自動配信：'+(x.delivery_enabled?'有効':'停止中')+'\n配信時刻：毎朝9時（日本時間）'+'\n伝票写真の転送：'+(x.receipt_import_enabled?'接続済み':'未接続')+'\n写真の転送履歴：'+JSON.stringify(x.receipt_relay)+'\n'+(x.receipt_relay_error||'')+'\n'+JSON.stringify(x.deliveries,null,2)}async function action(a){document.querySelectorAll('button').forEach(b=>b.disabled=true);try{const r=await fetch('/api/line/'+a,{method:'POST',headers:{'X-Tsukiya-Action':'line-settings'}});const x=await r.json();if(!r.ok)alert(x.error);await refresh()}catch(e){alert('通信結果を確認できません。再読み込みして送信履歴をご確認ください。')}finally{document.querySelectorAll('button').forEach(b=>b.disabled=false)}}refresh()</script></html>
