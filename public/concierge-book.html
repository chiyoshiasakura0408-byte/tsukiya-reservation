<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>西天満つきや｜常連様のご予約</title><style>body{margin:0;background:#f6f3ec;color:#182b39;font:16px/1.8 -apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}main{max-width:640px;margin:32px auto;padding:28px;background:white;border-radius:14px}h1{font-size:25px}label{display:block;margin:16px 0}input,textarea{box-sizing:border-box;width:100%;padding:12px;border:1px solid #ccc;border-radius:6px;font:inherit}input[type=checkbox]{width:auto}button{padding:14px 20px;background:#153d40;color:white;border:0;border-radius:8px;font:inherit}#summary,#message{white-space:pre-wrap}small{color:#586962}@media(max-width:680px){main{margin:12px;padding:20px}}</style><main><small>西天満つきや</small><h1>常連様のご予約</h1><p id="summary">ご案内内容を確認しております。</p><p>こちらのご予約は、前受けのお支払いなしで承ります。お料理代・お飲み物代は、ご来店時にお支払いください。</p><form id="form" hidden><label>お名前<input name="guest_name" autocomplete="name" required maxlength="80"></label><label>電話番号<input name="phone" type="tel" autocomplete="tel" required maxlength="50"></label><label>メールアドレス<input name="email" type="email" autocomplete="email" required maxlength="254"></label><label>ご要望・お帰りのタクシーなど<textarea name="guest_note" rows="3" maxlength="1000"></textarea></label><small>特別なご要望の対応可否は、朝倉からの回答をお待ちください。</small><h2>キャンセルポリシー</h2><p>ご予約日の3日前から当日・無断キャンセルはコース料金の100%を申し受けます。減員・日程変更も3日前より対象となります。ご連絡なく15分以上遅れた場合は、キャンセル扱いとなる場合がございます。</p><label><input name="cancellation_policy_accepted" type="checkbox" required> キャンセルポリシーに同意します。</label><button>この内容で予約を確定する</button></form><p id="message" role="status"></p></main><script>
const token=location.hash.slice(1),form=document.getElementById('form'),message=document.getElementById('message');history.replaceState(null,'',location.pathname);async function call(path,data){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,...data})});const j=await r.json();if(!r.ok)throw Error(j.error||'確認できませんでした。');return j}function confirmed(j){form.hidden=true;document.getElementById('summary').textContent=j.confirmed?`ご予約を承りました。受付番号 ${j.reservation_id}\n前受けのお支払いはございません。`:`この受付は現在 ${j.status} です。店舗へお問い合わせください。`}
call('/api/concierge/booking-info',{}).then(j=>{if(j.reservation_id)return confirmed(j);document.getElementById('summary').textContent=`${j.date} ${j.time}・${j.party_size}名様\n${j.area==='PRIVATE'?'個室':'カウンター'}\n${j.course_name}\nお料理代合計 ¥${j.amount.toLocaleString()}（税込）`+(j.area==='PRIVATE'?'\n個室は別邸（大阪市北区西天満3-8-7）へお越しください。':'');form.hidden=false}).catch(e=>message.textContent=e.message);form.onsubmit=async e=>{e.preventDefault();e.submitter.disabled=true;try{const d=Object.fromEntries(new FormData(form));d.cancellation_policy_accepted=d.cancellation_policy_accepted==='on';confirmed(await call('/api/concierge/book',d))}catch(err){message.textContent=err.message;e.submitter.disabled=false}};
</script></html>
