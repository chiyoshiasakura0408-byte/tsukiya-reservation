<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>容量・提供量入力｜つきや</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f4ee;color:#20352f;font:16px/1.6 -apple-system,sans-serif}header{padding:24px 18px;background:#263a35;color:white}main{max-width:650px;margin:auto;padding:18px 16px 120px}h1{font-size:24px;margin:0}h2{font-size:18px;margin:0}input,button,select{font:inherit;min-height:48px;border:1px solid #c5cdc3;border-radius:9px;padding:10px;background:white;color:#20352f}input,select{width:100%;font-size:16px}label{display:block;margin:10px 0}article{padding:16px;margin:14px 0;background:white;border:1px solid #dce2da;border-radius:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.small{font-size:13px;color:#63726c}button{cursor:pointer}.tabs{display:flex;gap:10px}.tabs button{flex:1}.selected,.primary{background:#263a35;color:white}footer{position:fixed;bottom:0;left:0;right:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:#fafbf8;border-top:1px solid #ccd3c8}footer button{width:100%;max-width:618px;display:block;margin:auto}#status{white-space:pre-line;padding:12px 0}button:disabled{opacity:.5}a{color:inherit}input:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid #b5935a}[hidden]{display:none!important}</style>
<header><h1>酒類・飲料の容量入力</h1><div>容器容量と1杯の提供量を入力してください。</div></header>
<main><p><a href="/drinks">酒類在庫表へ</a></p><p id="status" role="status">読み込み中…</p><div id="app" hidden><nav class="tabs"><button data-branch="main" class="selected">本店</button><button data-branch="annex">別邸</button></nav><label>入力者のお名前<input id="actor" maxlength="40" autocomplete="name"></label><p class="small">単位はmlです。分からない欄は空欄のまま保存できます。瓶・缶を丸ごと提供する商品は「1本・1缶」を選択してください。</p><p id="progress"></p><section id="items"></section></div></main>
<footer id="footer" hidden><button id="save" class="primary">入力内容を保存</button></footer>
<script>
'use strict';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let token=sessionStorage.getItem('tsukiya_supplies_access')||'',rows=[],branch='main',busy=false;
const drafts=new Map(),hash=new URLSearchParams(location.hash.slice(1));
if(hash.get('access')){token=hash.get('access');sessionStorage.setItem('tsukiya_supplies_access',token);history.replaceState(null,'',location.pathname)}
$('#actor').value=localStorage.getItem('tsukiya_supplies_name')||'';
async function api(body){const r=await fetch('/api/drink-capacity'+(body?'/save':''),{method:body?'POST':'GET',headers:{'Content-Type':'application/json','X-Supplies-Token':token,'X-Tsukiya-Action':'supplies'},body:body?JSON.stringify(body):undefined});const x=await r.json();if(!r.ok)throw Error(x.error||'保存できませんでした');return x}
const key=id=>branch+':'+id;
function value(r){return {...r,...drafts.get(key(r.item_id))}}
function render(){const items=rows.filter(r=>r.branch===branch);$('#progress').textContent=(branch==='main'?'本店':'別邸')+'：'+items.filter(r=>r.bottle_ml&&r.serving_ml).length+' / '+items.length+'品 入力済み';$('#items').innerHTML=items.map(base=>{const r=value(base),id=r.item_id;return `<article data-id="${id}"><h2>${esc(r.name)}</h2><div class="grid"><label>容器容量（ml）<input type="number" inputmode="decimal" min="0.1" max="100000" step="any" data-field="bottle_ml" value="${r.bottle_ml??''}" placeholder="例：720"></label><label>1杯の提供量（ml）<input type="number" inputmode="decimal" min="0.1" max="100000" step="any" data-field="serving_ml" value="${r.whole?(r.bottle_ml??''):(r.serving_ml??'')}" ${r.whole?'disabled':''} placeholder="例：90"></label></div><label>提供方法<select data-field="whole"><option value="false" ${!r.whole?'selected':''}>グラス・杯に注いで提供</option><option value="true" ${r.whole?'selected':''}>1本・1缶をそのまま提供</option></select></label><p class="small">${r.updated?'最終保存 '+esc(r.updated.slice(0,16).replace('T',' '))+' ／ '+esc(r.actor):'未入力'}${drafts.has(key(id))?' ／ 未保存':''}</p></article>`}).join('')}
function changed(e){const el=e.target,card=el.closest('article');if(!card||!el.dataset.field)return;const id=Number(card.dataset.id),base=rows.find(r=>r.branch===branch&&r.item_id===id),r=value(base);const patch={item_id:id,version:base.version,bottle_ml:r.bottle_ml,serving_ml:r.serving_ml,whole:!!r.whole};patch[el.dataset.field]=el.dataset.field==='whole'?el.value==='true':el.value===''?null:Number(el.value);drafts.set(key(id),patch);$('#status').textContent='未保存の入力があります';if(el.dataset.field==='whole'){render()}else if(el.dataset.field==='bottle_ml'&&patch.whole){card.querySelector('[data-field="serving_ml"]').value=el.value}}
$('#items').addEventListener('input',changed);$('#items').addEventListener('change',e=>{if(e.target.tagName==='SELECT')changed(e)});
document.querySelectorAll('[data-branch]').forEach(b=>b.onclick=()=>{if(busy)return;branch=b.dataset.branch;document.querySelectorAll('[data-branch]').forEach(x=>x.classList.toggle('selected',x===b));render()});
$('#save').onclick=async()=>{if(busy)return;const actor=$('#actor').value.trim();if(!actor){$('#status').textContent='入力者のお名前を入力してください';$('#actor').focus();return}const entries=[...drafts].filter(([k])=>k.startsWith(branch+':'));if(!entries.length){$('#status').textContent='変更はありません';return}busy=true;document.querySelectorAll('input,button,select').forEach(x=>x.disabled=true);try{await api({branch,actor,items:entries.map(([,p])=>p)});entries.forEach(([k])=>drafts.delete(k));localStorage.setItem('tsukiya_supplies_name',actor);rows=(await api()).items;$('#status').textContent='保存しました。入力内容は朝倉が確認できます。'}catch(e){$('#status').textContent=e.message}finally{busy=false;document.querySelectorAll('input,button,select').forEach(x=>x.disabled=false);render()}};
window.addEventListener('beforeunload',e=>{if(drafts.size){e.preventDefault();e.returnValue=''}});
api().then(x=>{rows=x.items;$('#app').hidden=false;$('#footer').hidden=false;$('#status').textContent='';render()}).catch(e=>$('#status').textContent=e.message+'。経理LINEの専用リンクから開き直してください。');
</script></html>
