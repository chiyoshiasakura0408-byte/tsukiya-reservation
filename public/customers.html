<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f2742"><title>西天満 つきや｜顧客管理</title>
<style>
:root{--navy:#0f2742;--gold:#b28a47;--line:#e7e1d7;--bg:#f5f3ee;--muted:#687381}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#202938;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}header{background:var(--navy);color:#fff;padding:17px 20px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:20px;font-weight:800}header button{background:#fff}main{max-width:1450px;margin:auto;padding:16px}.pages{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}.pages a{padding:11px 18px;border-radius:10px;text-decoration:none;background:#fff;color:var(--navy);border:1px solid var(--line);font-weight:800}.pages a.active{background:var(--navy);color:#fff}.layout{display:grid;grid-template-columns:minmax(360px,1fr) minmax(380px,1.15fr);gap:14px;align-items:start}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px;min-width:0}.list-card,.detail-card{height:calc(100dvh - 155px);min-height:550px;overflow:auto;overscroll-behavior:contain}h1,h2,h3{color:var(--navy);margin:0 0 12px}h1{font-size:20px}h2{font-size:18px}h3{font-size:15px}.muted{color:var(--muted);font-size:12px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.toolbar h1{margin:0}button{border:1px solid var(--line);background:white;color:var(--navy);border-radius:9px;padding:9px 12px;font-weight:800;cursor:pointer}button.primary{background:var(--navy);color:#fff;border-color:var(--navy)}input,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px;font:inherit}label{display:block;font-size:12px;color:var(--muted);margin:0 0 4px}.search{margin-bottom:12px}.customer{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;margin:7px 0;padding:11px;background:#fff;cursor:pointer}.customer:hover,.customer.active{background:#f7f1e6;border-color:#cfb98f}.customer strong{display:block}.customer small{display:block;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}.count{color:var(--navy);background:#f4f6f8;white-space:nowrap}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wide{grid-column:1/-1}textarea{min-height:66px;resize:vertical}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin:10px 0 16px}.visit{border:1px solid var(--line);border-radius:11px;padding:11px;margin:8px 0;background:#fff}.visit summary{cursor:pointer;font-weight:800;color:var(--navy);line-height:1.5}.visit summary small{font-weight:400;color:var(--muted)}.visit-body{padding-top:11px}.visit-body p{font-size:12px;color:var(--muted);margin:0 0 10px}.visit-body label{margin-top:9px}.visit-body button{margin-top:9px}.message{font-size:12px;min-height:20px;color:#8b5b1b}.badge{display:inline-block;border-radius:9px;padding:2px 6px;background:#e7edf4;font-size:11px;margin-left:4px}@media(max-width:900px){.layout{grid-template-columns:1fr}.list-card,.detail-card{height:auto;min-height:0;max-height:none}}@media(max-width:540px){header{padding:13px}.brand{font-size:16px}main{padding:10px}.pages a{padding:10px;flex:1;text-align:center;font-size:12px}.card{padding:12px}.formgrid{grid-template-columns:1fr}.wide{grid-column:auto}}
.badge.CONFIRMED{background:#e4f4ec;color:#1f7a5a}.new-reservation{display:inline-block;padding:10px 13px;border-radius:9px;background:#0f2742;color:white;text-decoration:none;font-weight:700;margin-bottom:12px}.fold-panel>summary{display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;list-style:none;min-height:44px}.fold-panel>summary::-webkit-details-marker{display:none}.fold-panel>summary h2{margin:0}.fold-panel>summary::after{content:"＋";font-size:24px;flex-shrink:0}.fold-panel[open]>summary::after{content:"−"}.fold-content{padding-top:14px}.fold-panel>summary:focus-visible{outline:2px solid var(--gold);outline-offset:5px;border-radius:6px}.blocked-badge{display:inline-block;background:#a52c31;color:#fff;padding:3px 7px;border-radius:6px;font-size:12px;margin-left:8px}.block-panel{border:1px solid #ce9696;background:#fff5f5;padding:14px;border-radius:10px;margin:12px 0}.block-panel textarea{margin:6px 0}.block-panel button{min-height:44px}.block-history{font-size:12px;line-height:1.7;white-space:pre-wrap}.block-filter{display:flex;align-items:center;gap:7px;margin-bottom:10px}.block-filter input{width:auto}</style></head><body><header><div class="brand">西天満 つきや｜顧客管理</div><button onclick="logout()">ログアウト</button></header><main><nav class="pages" aria-label="管理画面"><a href="/">決済管理</a><a href="/reservations">予約管理</a><a href="/customers" class="active">顧客管理</a><a href="https://tsukiya-daily-finance.chiyoshi-a-0408.chatgpt.site/clock" target="_blank" rel="noopener noreferrer">顔認証打刻</a><a href="/concierge">LINEコンシェルジュ</a></nav><details class="card fold-panel" id="vipPanel"><summary><h2>LINE VIP利用申請・承認</h2></summary><div class="fold-content"><p class="muted">ご本人と顧客情報を確認して操作してください。「取消し」で確認後にVIP利用を停止し、このリストから非表示にします。顧客情報・予約・操作履歴は残り、再招待も可能です。</p><div id="vipApplications">読み込み中…</div><button onclick="loadVip()">承認状況を更新</button></div></details><div class="layout"><section class="card list-card"><div class="toolbar"><h1>お客様検索</h1><button class="primary" onclick="openCard()">＋ 名刺登録</button><button onclick="loadCustomers()">更新</button></div><input class="search" id="search" type="search" placeholder="お名前・会社名・電話番号で検索" aria-label="お客様検索" oninput="renderList(true)"><label class="block-filter"><input type="checkbox" id="blockedOnly" onchange="renderList(true)">予約拒否のお客様のみ表示</label><div id="list" class="muted">お名前・会社名・電話番号などを入力して検索してください。</div></section><section class="card detail-card" id="detail"><h2>顧客情報</h2><p class="muted">検索結果からお客様を選択してください。</p></section></div><p id="message" class="message" role="status"></p></main>
<script>
let customers=[],selectedId=Number(new URLSearchParams(location.search).get('customer_id'))||null,detail=null;const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,options={}){options.credentials='same-origin';options.headers={'Content-Type':'application/json',...(options.headers||{})};const res=await fetch(url,options);if(res.status===401){location.href='/login';throw Error('ログインしてください')}const data=await res.json();if(!res.ok)throw Error(data.error||'通信に失敗しました');return data}
async function logout(){await fetch('/api/logout',{method:'POST',credentials:'same-origin'});location.href='/login'}
async function loadCustomers(){try{customers=await api('/api/customers');renderList();if(selectedId)await showCustomer(selectedId);loadVip()}catch(e){$('message').textContent=e.message}}
function renderList(clearSelection=false){if(clearSelection){selectedId=null;detail=null;$('detail').innerHTML='<h2>顧客情報</h2><p class="muted">検索結果からお客様を選択してください。</p>';}const q=$('search').value.trim().toLowerCase();const blockedOnly=$('blockedOnly').checked;if(!q&&!selectedId&&!blockedOnly){$('list').textContent='お名前・会社名・電話番号などを入力して検索してください。';return;}const rows=customers.filter(c=>(!blockedOnly||c.booking_blocked)&&(q?[c.name,c.company_name,c.phone,c.email].some(v=>String(v||'').toLowerCase().includes(q)):blockedOnly||Number(c.id)===selectedId));$('list').innerHTML=rows.length?rows.map(c=>`<div class="customer ${Number(c.id)===selectedId?'active':''}" tabindex="0" role="button" onclick="showCustomer(${Number(c.id)})" onkeydown="if(event.key==='Enter')showCustomer(${Number(c.id)})"><div><strong>${esc(c.name)}${c.booking_blocked?'<span class="blocked-badge">予約拒否</span>':''}</strong><small>${esc(c.company_name||'会社名未登録')}　${esc(c.phone||c.email||'連絡先未登録')}</small></div><button class="count" onclick="event.stopPropagation();showCustomer(${Number(c.id)},true)">来店 ${Number(c.visit_count)}回</button></div>`).join(''):'該当するお客様はいません';}
async function showCustomer(id,history=false){id=Number(id);if(!Number.isSafeInteger(id)||id<=0)return;selectedId=id;detail=null;$('detail').innerHTML='<h2>顧客情報</h2><p class="muted">読み込み中…</p>';try{const result=await api(`/api/customers/${id}`);if(selectedId!==id)return;if(Number(result.customer?.id)!==id)throw Error('顧客情報を確認できませんでした。もう一度開いてください。');detail=result;renderList();renderDetail();const target=history?$('history'):$('detail');target.scrollIntoView({block:'start',behavior:'smooth'});}catch(e){if(selectedId!==id)return;selectedId=null;detail=null;$('detail').innerHTML='<h2>顧客情報</h2><p class="muted">'+esc(e.message)+'</p>';$('message').textContent=e.message;renderList();}}
function renderDetail(){const c=detail.customer;$('detail').innerHTML=`<h2>${esc(c.name)} 様${c.booking_blocked?'<span class="blocked-badge">予約拒否</span>':''}</h2>${bookingBlockPanel(c)}${c.booking_blocked?'':`<a class="new-reservation" href="/reservations?mode=direct&customer_id=${Number(c.id)}">＋ 新規予約作成</a>`}<p class="muted">直接予約として確定し、確定メールのみ送信します。お料理代は当日精算です。</p><p class="muted">予約・名刺から登録された顧客情報です。変更は保存後に反映されます。</p><div class="formgrid">${[['name','名前'],['company_name','会社名'],['receipt_name','領収書名'],['phone','電話番号'],['email','アドレス']].map(([key,label])=>`<div><label for="c_${key}">${label}</label><input id="c_${key}" value="${esc(c[key])}" maxlength="${key==='email'?254:150}"></div>`).join('')}<div class="wide"><h3>お好み・お食事の注意事項</h3></div>${[['allergies','アレルギー'],['disliked_foods','苦手食材'],['preferred_seat','好みの席'],['preferred_drinks','好みの飲み物'],['preferred_crab','好みの蟹'],['return_transport','お帰りの交通手段']].map(([key,label])=>`<div><label for="c_${key}">${label}</label><textarea id="c_${key}" maxlength="${key==='preferred_seat'?500:1000}">${esc(c[key])}</textarea></div>`).join('')}<div><label><input id="c_soft_drink_only" type="checkbox" ${c.soft_drink_only==='1'?'checked':''} style="width:auto"> ソフトドリンクのみ（隠し酒案内から除外）</label><label for="c_alcohol_service">飲酒案内</label><select id="c_alcohol_service"><option value="">未確認</option><option value="可" ${c.alcohol_service==='可'?'selected':''}>可能（成人・案内可を確認済み）</option><option value="不可" ${c.alcohol_service==='不可'?'selected':''}>不可</option></select><p class="muted">ソフトドリンクのチェックを優先します。未確認・不可の方へは配信しません。</p></div><div class="wide"><label for="c_note">備考欄</label><textarea id="c_note" maxlength="2000">${esc(c.note)}</textarea></div></div><div class="form-actions"><button class="primary" onclick="saveCustomer()">顧客情報を保存</button></div>${tablecheckArchive()}<h3>Squareの保存済みカード</h3><button onclick="checkCards()">登録カードを確認する</button><p id="savedCards"></p><p class="muted">非対面決済は、お客様のカード利用承諾・今回の請求額を確認してSquare管理画面で行います。このボタンでは課金しません。</p><a href="https://squareup.com/dashboard/customers" target="_blank" rel="noopener noreferrer">Squareで精算する</a><h3>コンシェルジュ本人連携</h3><p class="muted">ご本人と確認したお客様にのみ連携文をお渡しください。LINEまたはInstagram DMで送っていただくと、この顧客情報に紐付きます。</p><button onclick="linkConcierge()">連携文を発行する</button><p id="customerLink"></p><h3 id="history">来店履歴・予約履歴</h3><p><strong>累計来店 ${Number(c.visit_count||0)}回</strong>（TableCheck ${Number(c.tablecheck_visit_count||0)}回 ＋ 新システム ${Number(c.local_visit_count||0)}回${c.overlap_visit_count?' − 重複期間 '+Number(c.overlap_visit_count)+'回':''}）</p>${c.last_visit?`<p class="muted">最終来店：${esc(c.last_visit.replace('T',' '))}</p>`:''}<p class="muted">来店回数はTableCheckの過去分と新システムの来店日を過ぎた確定予約を合わせた回数です。重なる期間は多い方を採用します。履歴をタップすると追記できます。</p>${detail.visits.length?detail.visits.map(v=>`<details class="visit" id="visit_${v.id}"><summary>${esc(v.visit_at.replace('T',' '))}　${esc(v.course_name||'コース未設定')} <span class="badge ${esc(v.status)}">${esc(({CONFIRMED:'予約確定',CANCELLED:'取消',INVOICED:'決済待ち',PENDING:'申込中',ERROR:'要確認'}[v.status]||v.status))}</span><br><small>${Number(v.party_size)}名・${esc(v.seating_area||'席未設定')}</small></summary><div class="visit-body"><p>予約時の備考：${esc(v.guest_note||'なし')}<br>お祝い：${esc(v.celebration_items||'なし')}　プレート：${esc(v.plate_message||'なし')}</p><div>${(v.receipts||[]).map(r=>`<p><strong>伝票売上：¥${Number(r.sales).toLocaleString('ja-JP')}</strong>　<a href="${esc(r.imageUrl)}" target="_blank" rel="noopener noreferrer">原本写真を確認</a></p>`).join('')||'<p>紐付いた売上伝票はありません</p>'}</div><label for="companions_${v.id}">同伴者</label><input id="companions_${v.id}" maxlength="500" value="${esc(v.companions||'')}" placeholder="例：山田様、佐藤様"><label for="visit_note_${v.id}">この来店の備考</label><textarea id="visit_note_${v.id}" maxlength="2000" placeholder="お好み、会話、次回のご希望など">${esc(v.visit_note||'')}</textarea><button onclick="saveVisit(${v.id})">履歴を保存</button></div></details>`).join(''):'予約履歴はありません'}`}
function bookingBlockPanel(c){const b=c.booking_block||{active:false,reason:'',version:0,history:[]};return `<section class="block-panel" aria-label="ブラックリスト・予約拒否"><h3>ブラックリスト・予約拒否</h3><p>${b.active?'このお客様の新規予約は受付できません。':'現在、予約拒否の登録はありません。'}</p>${b.reason?`<p>最新の理由：${esc(b.reason)}</p>`:''}<p class="muted">電話番号・メールアドレス・連携済み顧客IDで照合します。氏名だけでは拒否しません。共有の電話番号・アドレスを利用する方も対象となるため、登録前にご確認ください。連絡先がない方は、顧客IDを指定した予約のみ拒否できます。既存予約はこの操作で取り消されません。</p><label for="bookingBlockReason">${b.active?'解除':'登録'}の理由（必須・店内のみ）</label><textarea id="bookingBlockReason" maxlength="1000" placeholder="日時・事実・対応内容を記載してください"></textarea><button type="button" id="bookingBlockSave" onclick="saveBookingBlock()">${b.active?'予約拒否を解除する':'予約拒否に登録する'}</button><p id="bookingBlockMessage" role="status"></p><details><summary>登録・解除履歴</summary><div class="block-history">${b.history.length?b.history.map(h=>`${esc(new Date(h.created_at).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'}))} ${h.active?'登録':'解除'}（${esc(h.actor)}）\n${esc(h.reason)}`).join('\n\n'):'履歴はありません'}</div></details></section>`}
let bookingBlockBusy=false;
async function saveBookingBlock(){if(bookingBlockBusy||!detail)return;const id=Number(detail.customer.id),b=detail.customer.booking_block;const reason=$('bookingBlockReason').value.trim();if(!reason){$('bookingBlockMessage').textContent='理由を入力してください。';return}if(!confirm(`${detail.customer.name}様の予約拒否を${b.active?'解除':'登録'}しますか？\n既存予約は変更されません。`))return;bookingBlockBusy=true;$('bookingBlockSave').disabled=true;try{await api(`/api/customers/${id}/booking-block`,{method:'POST',headers:{'X-Tsukiya-Action':'booking-block'},body:JSON.stringify({active:!b.active,reason,version:b.version})});$('message').textContent='予約拒否の設定を保存しました。';await loadCustomers()}catch(e){if($('bookingBlockMessage'))$('bookingBlockMessage').textContent=e.message}finally{bookingBlockBusy=false;if($('bookingBlockSave'))$('bookingBlockSave').disabled=false}}
async function saveCustomer(){const keys=['name','company_name','receipt_name','phone','email','allergies','disliked_foods','preferred_seat','preferred_drinks','preferred_crab','return_transport','alcohol_service','note'];const body=Object.fromEntries(keys.map(k=>[k,$(`c_${k}`).value]));body.soft_drink_only=$('c_soft_drink_only').checked?'1':'0';try{await api(`/api/customers/${selectedId}`,{method:'POST',body:JSON.stringify(body)});$('message').textContent='顧客情報を保存しました';await loadCustomers()}catch(e){$('message').textContent=e.message}}
async function saveVisit(id){const body={companions:$(`companions_${id}`).value,visit_note:$(`visit_note_${id}`).value};try{await api(`/api/customers/${selectedId}/visits/${id}`,{method:'POST',body:JSON.stringify(body)});$('message').textContent='来店履歴を保存しました';await showCustomer(selectedId);$(`visit_${id}`).open=true}catch(e){$('message').textContent=e.message}}
async function checkCards(){try{const j=await api(`/api/customers/${selectedId}/square-cards`);$('savedCards').textContent=j.cards.length?j.cards.map(c=>`${c.brand} 下4桁 ${c.last4}`).join('、'):j.status==='checked'?'利用可能な保存カードは見つかりませんでした。':j.message}catch(e){$('savedCards').textContent=e.message}}
async function linkConcierge(){try{const r=await fetch('/api/concierge/configure',{method:'POST',headers:{'Content-Type':'application/json','X-Tsukiya-Action':'concierge'},body:JSON.stringify({action:'customer-link',customer_id:selectedId})});const j=await r.json();if(!r.ok)throw Error(j.error);$('customerLink').textContent=j.command+' （24時間有効・1回限り）'}catch(e){$('message').textContent=e.message}}
let vipRows=[],vipBusy=false;
async function loadVip(){if(vipBusy)return;try{vipRows=(await api('/api/vip-access')).filter(r=>!['rejected','revoked'].includes(r.status));$('vipApplications').innerHTML=vipRows.length?vipRows.map((r,i)=>`<div class="visit"><strong>${esc(r.name)}</strong>　${esc(({pending:'申請中',approved:'許可済み'}[r.status]||r.status))}<p>紹介者：${esc(r.introducer)}<br>連携顧客：${esc(r.customer_name||'未連携')}</p><button onclick="cancelVip(${i})">取消し</button></div>`).join(''):'表示するVIP利用申請・利用者はいません。'}catch(e){$('vipApplications').textContent=e.message}}
async function cancelVip(i){if(vipBusy)return;const row=vipRows[i];if(!row||!confirm(`${row.name}様のVIP利用を取り消しますか？\n顧客情報・予約・操作履歴は残ります。`))return;vipBusy=true;const buttons=$('vipApplications').querySelectorAll('button');buttons.forEach(b=>b.disabled=true);try{await api('/api/vip-access/decision',{method:'POST',headers:{'X-Tsukiya-Action':'vip-access'},body:JSON.stringify({user_id:row.user_id,decision:'revoked'})});$('message').textContent=`${row.name}様のVIP利用を取り消しました。`;}catch(e){$('message').textContent=e.message;}finally{vipBusy=false;buttons.forEach(b=>b.disabled=false);await loadVip();}}

function tablecheckArchive(){return (detail.tablecheck_imports||[]).map(r=>`<section class="visit"><h3>TableCheckから引き継いだ顧客情報</h3><p class="muted">顧客ID：${esc(r.source_id)} ／ 取込日時：${esc(r.imported_at)}。元データを参考情報として保持しています。</p><details><summary>元の顧客情報・メモ・予約履歴を表示</summary><dl>${Object.entries(r.fields).filter(([k,v])=>v).map(([k,v])=>`<dt><strong>${esc(k)}</strong></dt><dd style="white-space:pre-wrap;overflow-wrap:anywhere;margin:4px 0 16px">${esc(v)}</dd>`).join('')}</dl></details></section>`).join('');}

loadCustomers();
</script><script src="/public/business-cards.js"></script></body></html>
