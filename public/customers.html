<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f2742"><title>西天満 つきや｜顧客管理</title>
<style>
:root{--navy:#0f2742;--gold:#b28a47;--line:#e7e1d7;--bg:#f5f3ee;--muted:#687381}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#202938;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}header{background:var(--navy);color:#fff;padding:17px 20px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:20px;font-weight:800}header button{background:#fff}main{max-width:1450px;margin:auto;padding:16px}.pages{display:flex;gap:8px;margin-bottom:14px}.pages a{padding:11px 18px;border-radius:10px;text-decoration:none;background:#fff;color:var(--navy);border:1px solid var(--line);font-weight:800}.pages a.active{background:var(--navy);color:#fff}.layout{display:grid;grid-template-columns:minmax(360px,1fr) minmax(380px,1.15fr);gap:14px;align-items:start}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px;min-width:0}.list-card,.detail-card{height:calc(100dvh - 155px);min-height:550px;overflow:auto;overscroll-behavior:contain}h1,h2,h3{color:var(--navy);margin:0 0 12px}h1{font-size:20px}h2{font-size:18px}h3{font-size:15px}.muted{color:var(--muted);font-size:12px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.toolbar h1{margin:0}button{border:1px solid var(--line);background:white;color:var(--navy);border-radius:9px;padding:9px 12px;font-weight:800;cursor:pointer}button.primary{background:var(--navy);color:#fff;border-color:var(--navy)}input,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px;font:inherit}label{display:block;font-size:12px;color:var(--muted);margin:0 0 4px}.search{margin-bottom:12px}.customer{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;margin:7px 0;padding:11px;background:#fff;cursor:pointer}.customer:hover,.customer.active{background:#f7f1e6;border-color:#cfb98f}.customer strong{display:block}.customer small{display:block;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}.count{color:var(--navy);background:#f4f6f8;white-space:nowrap}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wide{grid-column:1/-1}textarea{min-height:66px;resize:vertical}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin:10px 0 16px}.visit{border:1px solid var(--line);border-radius:11px;padding:11px;margin:8px 0;background:#fff}.visit summary{cursor:pointer;font-weight:800;color:var(--navy);line-height:1.5}.visit summary small{font-weight:400;color:var(--muted)}.visit-body{padding-top:11px}.visit-body p{font-size:12px;color:var(--muted);margin:0 0 10px}.visit-body label{margin-top:9px}.visit-body button{margin-top:9px}.message{font-size:12px;min-height:20px;color:#8b5b1b}.badge{display:inline-block;border-radius:9px;padding:2px 6px;background:#e7edf4;font-size:11px;margin-left:4px}@media(max-width:900px){.layout{grid-template-columns:1fr}.list-card,.detail-card{height:auto;min-height:0;max-height:none}}@media(max-width:540px){header{padding:13px}.brand{font-size:16px}main{padding:10px}.pages a{padding:10px;flex:1;text-align:center;font-size:12px}.card{padding:12px}.formgrid{grid-template-columns:1fr}.wide{grid-column:auto}}
.badge.CONFIRMED{background:#e4f4ec;color:#1f7a5a}.new-reservation{display:inline-block;padding:10px 13px;border-radius:9px;background:#0f2742;color:white;text-decoration:none;font-weight:700;margin-bottom:12px}</style></head><body><header><div class="brand">西天満 つきや｜顧客管理</div><button onclick="logout()">ログアウト</button></header><main><nav class="pages" aria-label="管理画面"><a href="/">決済管理</a><a href="/reservations">予約管理</a><a href="/customers" class="active">顧客管理</a><a href="/concierge">LINEコンシェルジュ</a></nav><div class="layout"><section class="card list-card"><div class="toolbar"><h1>お客様一覧</h1><button onclick="loadCustomers()">更新</button></div><input class="search" id="search" type="search" placeholder="お名前・会社名・電話番号で検索" aria-label="お客様検索" oninput="renderList()"><div id="list" class="muted">読み込み中…</div></section><section class="card detail-card" id="detail"><h2>顧客情報</h2><p class="muted">左の一覧からお客様を選択してください。</p></section></div><p id="message" class="message" role="status"></p></main>
<script>
let customers=[],selectedId=Number(new URLSearchParams(location.search).get('customer_id'))||null,detail=null;const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,options={}){options.credentials='same-origin';options.headers={'Content-Type':'application/json',...(options.headers||{})};const res=await fetch(url,options);if(res.status===401){location.href='/login';throw Error('ログインしてください')}const data=await res.json();if(!res.ok)throw Error(data.error||'通信に失敗しました');return data}
async function logout(){await fetch('/api/logout',{method:'POST',credentials:'same-origin'});location.href='/login'}
async function loadCustomers(){try{customers=await api('/api/customers');renderList();if(selectedId)await showCustomer(selectedId)}catch(e){$('message').textContent=e.message}}
function renderList(){const q=$('search').value.trim().toLowerCase();const rows=customers.filter(c=>[c.name,c.company_name,c.phone,c.email].some(v=>String(v||'').toLowerCase().includes(q)));$('list').innerHTML=rows.length?rows.map(c=>`<div class="customer ${c.id===selectedId?'active':''}" tabindex="0" role="button" onclick="showCustomer(${c.id})" onkeydown="if(event.key==='Enter')showCustomer(${c.id})"><div><strong>${esc(c.name)}</strong><small>${esc(c.company_name||'会社名未登録')}　${esc(c.phone||c.email||'連絡先未登録')}</small></div><button class="count" onclick="event.stopPropagation();showCustomer(${c.id},true)">来店 ${Number(c.visit_count)}回</button></div>`).join(''):'該当するお客様はいません';}
async function showCustomer(id,history=false){try{selectedId=id;detail=await api(`/api/customers/${id}`);renderList();renderDetail();if(history){$('history').scrollIntoView({block:'nearest',behavior:'smooth'})}}catch(e){$('message').textContent=e.message}}
function renderDetail(){const c=detail.customer;$('detail').innerHTML=`<h2>${esc(c.name)} 様</h2><a class="new-reservation" href="/reservations?mode=direct&customer_id=${Number(c.id)}">＋ 新規予約作成</a><p class="muted">直接予約として確定し、確定メールのみ送信します。お料理代は当日精算です。</p><p class="muted">予約情報から作成された顧客情報です。変更は保存後に反映されます。</p><div class="formgrid">${[['name','名前'],['company_name','会社名'],['receipt_name','領収書名'],['phone','電話番号'],['email','アドレス']].map(([key,label])=>`<div><label for="c_${key}">${label}</label><input id="c_${key}" value="${esc(c[key])}" maxlength="${key==='email'?254:150}"></div>`).join('')}<div class="wide"><h3>お好み・お食事の注意事項</h3></div>${[['allergies','アレルギー'],['disliked_foods','苦手食材'],['preferred_seat','好みの席'],['preferred_drinks','好みの飲み物']].map(([key,label])=>`<div><label for="c_${key}">${label}</label><textarea id="c_${key}" maxlength="${key==='preferred_seat'?500:1000}">${esc(c[key])}</textarea></div>`).join('')}<div class="wide"><label for="c_note">備考欄</label><textarea id="c_note" maxlength="2000">${esc(c.note)}</textarea></div></div><div class="form-actions"><button class="primary" onclick="saveCustomer()">顧客情報を保存</button></div><h3 id="history">来店履歴・予約履歴</h3><p class="muted">来店回数は来店日を過ぎた確定予約を数えます。履歴をタップすると追記できます。</p>${detail.visits.length?detail.visits.map(v=>`<details class="visit" id="visit_${v.id}"><summary>${esc(v.visit_at.replace('T',' '))}　${esc(v.course_name||'コース未設定')} <span class="badge ${esc(v.status)}">${esc(({CONFIRMED:'予約確定',CANCELLED:'取消',INVOICED:'決済待ち',PENDING:'申込中',ERROR:'要確認'}[v.status]||v.status))}</span><br><small>${Number(v.party_size)}名・${esc(v.seating_area||'席未設定')}</small></summary><div class="visit-body"><p>予約時の備考：${esc(v.guest_note||'なし')}<br>お祝い：${esc(v.celebration_items||'なし')}　プレート：${esc(v.plate_message||'なし')}</p><label for="companions_${v.id}">同伴者</label><input id="companions_${v.id}" maxlength="500" value="${esc(v.companions||'')}" placeholder="例：山田様、佐藤様"><label for="visit_note_${v.id}">この来店の備考</label><textarea id="visit_note_${v.id}" maxlength="2000" placeholder="お好み、会話、次回のご希望など">${esc(v.visit_note||'')}</textarea><button onclick="saveVisit(${v.id})">履歴を保存</button></div></details>`).join(''):'予約履歴はありません'}`}
async function saveCustomer(){const keys=['name','company_name','receipt_name','phone','email','allergies','disliked_foods','preferred_seat','preferred_drinks','note'];const body=Object.fromEntries(keys.map(k=>[k,$(`c_${k}`).value]));try{await api(`/api/customers/${selectedId}`,{method:'POST',body:JSON.stringify(body)});$('message').textContent='顧客情報を保存しました';await loadCustomers()}catch(e){$('message').textContent=e.message}}
async function saveVisit(id){const body={companions:$(`companions_${id}`).value,visit_note:$(`visit_note_${id}`).value};try{await api(`/api/customers/${selectedId}/visits/${id}`,{method:'POST',body:JSON.stringify(body)});$('message').textContent='来店履歴を保存しました';await showCustomer(selectedId);$(`visit_${id}`).open=true}catch(e){$('message').textContent=e.message}}
loadCustomers();
</script></body></html>
