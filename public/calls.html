<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>着信履歴｜西天満つきや</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;color:#172b40;background:#f3f5f7}*{box-sizing:border-box}body{margin:0}header{background:#142a41;color:white;padding:22px}header h1{font-size:21px;margin:0 0 12px}nav{display:flex;gap:20px;flex-wrap:wrap}nav a{color:inherit}main{max-width:1200px;margin:auto;padding:20px}.layout{display:grid;grid-template-columns:1fr 1.25fr;gap:20px}.card{background:white;border:1px solid #d8dfe6;border-radius:12px;padding:20px;margin-bottom:15px}button,.button{font:inherit;display:inline-block;background:white;border:1px solid #9aabbc;border-radius:7px;padding:11px 15px;min-height:44px;color:#172b40;cursor:pointer;text-decoration:none}.primary{background:#173954;color:white}label{display:block;margin:16px 0 6px}input,textarea,select{font:inherit;width:100%;padding:12px;border:1px solid #9aabbc;border-radius:6px}textarea{min-height:120px}.muted{color:#596b7d;font-size:14px}.row{width:100%;text-align:left;margin-bottom:10px;line-height:1.7}.row.active{border:2px solid #193d5d}.badge{font-size:13px;background:#f0e6cf;padding:3px 8px;border-radius:5px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}dl{display:grid;grid-template-columns:90px 1fr;gap:10px}dt{color:#596b7d}dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}.candidate{border-top:1px solid #ddd;padding:15px 0}.note{white-space:pre-wrap}#message{color:#904300}@media(max-width:720px){.layout{grid-template-columns:1fr}main{padding:12px}.card{padding:15px}}
</style></head><body><header><h1>西天満つきや｜着信履歴</h1><nav><a href="/reservations">予約管理</a><a href="/customers">顧客管理</a><a href="/">決済管理</a></nav></header><main><div class="card"><strong id="connection">接続状況を確認しています</strong><p class="muted">iPad・iPhoneを閉じていてもサーバーで記録します。着信だけでは予約は確定しません。携帯の留守番電話が応答した場合も「接続済み」になります。</p><p id="sync" class="muted"></p><div class="actions"><button id="refresh">更新</button></div><p id="message" role="status"></p></div><div class="layout"><section class="card"><h2>着信一覧</h2><p class="muted">営業時間外・店休日も保存。新着は10秒ごとに確認します。</p><div id="list"></div><button id="more" hidden>以前の履歴を表示</button></section><section class="card" id="detail"><p>着信を選ぶと、顧客候補と対応メモを確認できます。</p></section></div></main><script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let rows=[],selected=null,next=null,busy=false;
async function api(path,data){const r=await fetch(path,{method:data?'POST':'GET',credentials:'same-origin',headers:data?{'Content-Type':'application/json','X-Tsukiya-Action':'phone-calls'}:{},body:data?JSON.stringify(data):undefined});if(r.status===401){location.href='/login';throw Error('ログインしてください')}const j=await r.json();if(!r.ok)throw Error(j.error||'通信に失敗しました');return j}
const when=v=>new Date(v).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'});
function state(r){return ({initiated:'携帯へ接続中',queued:'接続待ち',ringing:'携帯呼び出し中','in-progress':'接続中',completed:'接続済み・終了',busy:'話中','no-answer':'応答なし',failed:'接続失敗',canceled:'呼び出し取消'}[r.forward_status]|| (['completed','canceled','failed'].includes(r.inbound_status)?'終了・携帯接続結果未確認':'着信・接続結果待ち'))}
function title(r){const match=r.candidates.find(c=>c.id===r.customer_id);return match?match.name:r.candidates.length===1?r.candidates[0].name+'（候補）':r.candidates.length>1?'顧客候補 '+r.candidates.length+'件':'未登録・番号確認'}
function renderList(){$('list').innerHTML=rows.length?rows.map(r=>`<button class="row ${selected===r.id?'active':''}" data-call="${r.id}"><strong>${esc(title(r))}</strong> <span class="badge">${r.handled?'対応済み':'未対応'}</span><br>${esc(r.from_number)}<br><small>${esc(when(r.received_at))}｜${esc(state(r))}</small></button>`).join(''):'着信履歴はまだありません。';document.querySelectorAll('[data-call]').forEach(b=>b.onclick=()=>show(Number(b.dataset.call)))}
async function refresh(older=false){if(busy)return;busy=true;try{const j=await api('/api/phone-calls'+(older&&next?'?before='+next:''));$('connection').textContent=j.configured?'予約電話連携：設定済み '+j.number:'予約電話連携：未開通（番号・転送先・Twilio設定が必要）';$('sync').textContent=(j.last_sync?'履歴照合：'+when(j.last_sync):'履歴照合：まだ実行されていません')+(j.sync_error?' ／ '+j.sync_error:'');rows=older?[...rows,...j.items]:[...j.items,...rows.filter(r=>!j.items.some(n=>n.id===r.id))];if(older||rows.length<=50)next=j.next_before;$('more').hidden=!next;renderList();const r=rows.find(r=>r.id===selected);if(r&&$('callState'))$('callState').textContent=state(r)+(r.duration!=null?'・接続時間 '+r.duration+'秒':'')}catch(e){$('message').textContent=e.message}finally{busy=false}}
async function show(id){try{const j=await api('/api/phone-calls/'+id),r=j.items[0];if(!r)throw Error('履歴が見つかりません');selected=id;renderList();$('detail').innerHTML=`<h2>${esc(r.from_number)}</h2><p>${esc(when(r.received_at))}</p><p id="callState">${esc(state(r))}${r.duration!=null?'・接続時間 '+r.duration+'秒':''}</p><p class="muted">番号一致は顧客候補です。ご本人を確認して選択してください。</p><div id="candidates">${r.candidates.map(c=>`<div class="candidate"><strong>${esc(c.name)}</strong><dl><dt>アレルギー</dt><dd>${esc(c.allergies||'未登録')}</dd><dt>苦手食材</dt><dd>${esc(c.disliked_foods||'未登録')}</dd><dt>希望席</dt><dd>${esc(c.preferred_seat||'未登録')}</dd><dt>備考</dt><dd>${esc(c.note||'なし')}</dd></dl><button data-customer="${c.id}">${r.customer_id===c.id?'選択済み':'このお客様と確認'}</button> <a href="/customers?customer_id=${c.id}">来店・予約履歴</a></div>`).join('')||'<p>番号に一致する登録顧客はありません。</p>'}</div>${r.customer_id?`<p>紐付け済み顧客：<a href="/customers?customer_id=${r.customer_id}">顧客情報を開く</a> <button id="unlink">解除</button></p>`:''}<label for="customerSearch">別の顧客を名前・番号で検索</label><input id="customerSearch" type="search"><div id="searchResults"></div><div class="actions"><a class="button primary" href="/reservations?call_id=${r.id}">この着信から電話予約を入力</a></div><p class="muted">電話予約は従来どおり前受けの登録です。顧客を未選択の場合は氏名・連絡先を入力してください。</p><label for="note">対応メモ</label><textarea id="note" maxlength="2000">${esc(r.note)}</textarea><label for="handled">対応状況</label><select id="handled"><option value="0" ${!r.handled?'selected':''}>未対応</option><option value="1" ${r.handled?'selected':''}>対応済み</option></select><div class="actions"><button id="save" class="primary">メモ・対応状況を保存</button></div><h3>この電話から登録した予約</h3>${r.reservations.map(b=>`<p>#${b.id} ${esc(b.guest_name)} ${esc(b.visit_at.replace('T',' '))} ${esc(b.status)} <a href="/customers?customer_id=${r.customer_id||''}">顧客管理</a></p>`).join('')||'<p>予約登録はありません。</p>'}`;
$('save').onclick=async()=>{try{await api('/api/phone-calls/'+id,{note:$('note').value,handled:$('handled').value==='1'});$('message').textContent='保存しました';await refresh()}catch(e){$('message').textContent=e.message}};
const choose=async cid=>{try{await api('/api/phone-calls/'+id,{customer_id:cid,note:$('note').value,handled:$('handled').value==='1'});await show(id);await refresh()}catch(e){$('message').textContent=e.message}};document.querySelectorAll('[data-customer]').forEach(b=>b.onclick=()=>choose(Number(b.dataset.customer)));if($('unlink'))$('unlink').onclick=()=>choose(null);
let customers=null;$('customerSearch').oninput=async()=>{const q=$('customerSearch').value.trim().toLowerCase();if(q.length<2){$('searchResults').textContent='';return}try{if(!customers)customers=await api('/api/customers');if(selected!==id||!$('searchResults'))return;const found=customers.filter(c=>[c.name,c.phone].some(v=>String(v||'').toLowerCase().includes(q))).slice(0,8);$('searchResults').innerHTML=found.map(c=>`<button data-found="${c.id}">${esc(c.name)} ${esc(c.phone)}</button>`).join('');document.querySelectorAll('[data-found]').forEach(b=>b.onclick=()=>choose(Number(b.dataset.found)))}catch(e){$('message').textContent=e.message}};
}catch(e){$('message').textContent=e.message}}
$('refresh').onclick=()=>refresh();$('more').onclick=()=>refresh(true);refresh().then(()=>{const id=Number(new URLSearchParams(location.search).get('id'));if(id)show(id)});setInterval(()=>{if(!document.hidden)refresh()},10000);
</script></body></html>
