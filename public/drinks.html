<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#263a35"><title>酒類在庫｜西天満つきや</title>
<style>
:root{color-scheme:light;--ink:#20352f;--muted:#63726c;--line:#dce2da;--paper:#f5f4ee;--green:#263a35}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}button,input{font:inherit;min-height:48px}button{border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);padding:9px 12px;touch-action:manipulation;cursor:pointer}button:disabled{opacity:.5;cursor:default}input{width:100%;min-width:0;border:1px solid #c5cdc3;border-radius:10px;background:#fff;color:var(--ink);padding:10px;font-size:16px}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #b5935a;outline-offset:2px}[hidden]{display:none!important}header{background:var(--green);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 20px}header>div{max-width:640px;margin:auto}.eyebrow{font-size:11px;letter-spacing:.16em;color:#d1c4a9}h1{font-size:26px;font-weight:600;margin:5px 0}header p{font-size:13px;margin:4px 0;color:#e1e4dc}main{max-width:680px;padding:16px 16px 165px;margin:auto}.inventory-nav,.tabs,.filters{display:flex;gap:8px;margin:0 0 16px}.inventory-nav a{flex:1;text-align:center;display:block;padding:10px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);text-decoration:none;min-height:48px}.inventory-nav [aria-current]{background:#e9ede5;font-weight:600}.tabs button{flex:1}.selected,.primary{background:var(--green);color:#fff;border-color:var(--green)}label{display:block;font-size:14px;font-weight:500}#name{margin-top:5px}.summary{padding:15px;background:#e9ede5;border-radius:14px;margin:14px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.summary h2{font-size:20px;margin:0}.summary strong{font-size:22px;font-weight:500}.help,.sub{font-size:12px;color:var(--muted);margin:6px 0}.sub{overflow-wrap:anywhere}progress{width:100%;height:8px;accent-color:var(--green)}#search{margin:6px 0 12px}.filters{margin-bottom:10px}.filters button{font-size:13px;min-height:44px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}.card h3{font-size:17px;margin:0;overflow-wrap:anywhere}.tag{font-size:11px;padding:3px 8px;background:#edf0e8;border-radius:20px;white-space:nowrap}.quantity{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px;align-items:center}.quantity button{padding:7px}.quantity .step{font-size:22px}.quantity input{font-size:22px;text-align:center;padding:6px}.quantity .confirm{background:#eff3eb;font-size:14px}.saveinfo{color:#567647;font-size:12px;min-height:0;margin-top:4px}.footer{position:fixed;bottom:0;left:0;right:0;z-index:10;background:#fbfcf8f5;border-top:1px solid var(--line);padding:10px 16px calc(12px + env(safe-area-inset-bottom))}.footer>div{max-width:648px;margin:auto}.footer p{font-size:12px;margin:0 0 8px}.actions{display:grid;grid-template-columns:1fr 1.4fr;gap:8px}#toast{position:fixed;z-index:40;top:12px;left:12px;right:12px;margin:auto;max-width:620px;background:#20352f;color:#fff;padding:14px;border-radius:12px;white-space:pre-line}#toast.error{background:#8c332d}.errorbox{background:#fff0eb;border-radius:14px;padding:18px}.errorbox a{color:var(--ink)}dialog{width:calc(100% - 24px);max-width:540px;max-height:85dvh;overflow:auto;border:0;border-radius:18px;padding:20px;box-shadow:0 12px 80px #0003}dialog::backdrop{background:#15271f99}dialog h2{font-size:21px;margin:0}#reportPreview{white-space:pre-wrap;font-size:14px;overflow-wrap:anywhere}details{margin:18px 0}summary{min-height:44px;padding:10px 0;font-size:13px}.statusbox{font-size:13px;white-space:pre-line}.empty{padding:30px;text-align:center;color:var(--muted)}
</style></head><body>
<header><div><div class="eyebrow">NISHITENMA TSUKIYA · STAFF</div><h1>酒類・飲料在庫</h1><p>在庫数を入力して朝倉へ。発注は朝倉が判断します。</p></div></header>
<main>
<nav class="inventory-nav" aria-label="在庫表"><a href="/supplies">備品</a><a href="/drinks" aria-current="page">酒類・飲料</a></nav>
<div id="locked" class="errorbox" hidden><h2>経理LINEから開いてください</h2><p>経理LINEに「酒類」と送ると、在庫表のリンクが届きます。</p><p class="help">リンクは8日間有効です。</p><a href="/login">従業員ログイン</a><p class="help">ログイン後、この画面に戻ってください。</p><button id="reload">再読み込み</button></div>
<div id="app" hidden>
<div class="tabs" aria-label="店舗"><button data-branch="main" class="selected" aria-pressed="true" type="button">本店</button><button data-branch="annex" aria-pressed="false" type="button">別邸</button></div>
<label for="name">確認者のお名前<input id="name" maxlength="40" autocomplete="name" placeholder="例：朝倉"></label>
<section class="summary"><div class="row"><h2 id="branchTitle">本店</h2><strong id="progressText"></strong></div><progress id="progress" value="0" max="26" aria-label="入力済み品目数"></progress><p class="help" id="totals"></p></section>
<p class="help" id="counting"></p><p class="help">在庫がなければ「0」。未入力は空欄のまま区別します。</p>
<input id="search" type="search" placeholder="酒類・飲料名で探す" aria-label="酒類・飲料名で探す">
<nav class="filters" aria-label="表示する品目"><button data-filter="all" class="selected" aria-pressed="true" type="button">すべて</button><button data-filter="missing" aria-pressed="false" type="button">未入力</button></nav>
<section id="cards" aria-label="酒類・飲料一覧"></section>
<p class="help">必要なときに入力・送信できます。定期の確認依頼・自動集計はありません。</p>
<details><summary>送信状況</summary><div id="delivery" class="statusbox"></div></details>
</div><p id="loading">在庫表を読み込んでいます…</p>
</main>
<footer id="footer" class="footer" hidden><div><p id="unsaved"></p><div class="actions"><button id="save" type="button">入力を保存</button><button id="report" class="primary" type="button">朝倉へ在庫送信</button></div></div></footer>
<div id="toast" role="status" hidden></div>
<dialog id="confirmReport"><h2>朝倉へ在庫を送信</h2><p id="reportPreview"></p><div class="actions"><button id="cancelReport" type="button">戻る</button><button id="sendReport" class="primary" type="button">送信する</button></div></dialog>
<script>
'use strict';
const $=s=>document.querySelector(s), names={main:'本店',annex:'別邸'};
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let access=sessionStorage.getItem('tsukiya_supplies_access')||'',data,branch='main',filter='all',busy=false,toastTimer;
const drafts=new Map(), hash=new URLSearchParams(location.hash.slice(1));
if(hash.get('access')){access=hash.get('access');sessionStorage.setItem('tsukiya_supplies_access',access);history.replaceState(null,'',location.pathname)}
$('#name').value=localStorage.getItem('tsukiya_supplies_name')||'';
function toast(text,error=false){clearTimeout(toastTimer);$('#toast').textContent=text;$('#toast').hidden=false;$('#toast').classList.toggle('error',error);toastTimer=setTimeout(()=>$('#toast').hidden=true,6500)}
async function api(path='',body){const r=await fetch('/api/drinks'+path,{method:body?'POST':'GET',credentials:'same-origin',headers:{'Content-Type':'application/json','X-Supplies-Token':access,'X-Tsukiya-Action':'supplies'},body:body?JSON.stringify(body):undefined});const j=await r.json();if(!r.ok){if(r.status===401){$('#locked').hidden=false;$('#app').hidden=true;$('#footer').hidden=true}throw Error(j.error||'処理できませんでした')}return j}
async function load(){try{data=await api();$('#locked').hidden=true;$('#app').hidden=false;$('#footer').hidden=false;render()}catch(e){toast(e.message,true)}finally{$('#loading').hidden=true}}
const key=id=>branch+':'+id;
function original(id){return data.items.find(r=>r.branch===branch&&r.item_id===id)}
function item(id){return {...original(id),...(drafts.get(key(id))||{})}}
function draft(id,field,value){const r=item(id);drafts.set(key(id),{item_id:id,version:original(id).version,unopened:r.unopened,opened:r.opened,[field]:value});dirtyText()}
function dirtyText(){const n=[...drafts.keys()].filter(k=>k.startsWith(branch+':')).length;$('#unsaved').textContent=n?names[branch]+'：未保存 '+n+'品目':'保存済み';document.querySelectorAll('button,input').forEach(el=>el.disabled=busy);$('#save').disabled=busy||!n}
function render(){const s=data.summary[branch];$('#branchTitle').textContent=names[branch];$('#progressText').textContent=s.checked+' / '+s.total;$('#progress').value=s.checked;$('#progress').max=s.total;$('#totals').textContent='入力済み '+s.checked+'品目 ／ 未入力 '+s.missing+'品目';$('#counting').textContent=data.counting;$('#delivery').textContent='朝倉LINE：'+(data.owner_linked?'連携済み':'未連携')+'\n'+(data.notices.length?data.notices.map(n=>({pending:'送信待ち',accepted:'LINE受付済み',failed:'送信失敗',cancelled:'取消済み'}[n.state]||n.state)+(n.error?'：'+n.error:'')).join('\n'):'酒類在庫の送信履歴はまだありません');renderCards()}
function renderCards(){const search=$('#search').value.trim();const rows=data.items.filter(r=>r.branch===branch&&(!search||r.name.includes(search))&&(filter==='all'||!r.current));$('#cards').innerHTML=rows.length?rows.map(r=>card(item(r.item_id))).join(''):'<p class="empty">該当する品目はありません</p>';dirtyText()}
function card(r){const id=r.item_id,h=escapeHTML;return `<article class="card" data-id="${id}"><div class="row"><h3>${h(r.name)}</h3><span class="tag">${h(r.status)}</span></div><p class="sub">${r.all_in?'オールイン対象':'オールイン対象外'} ／ ${r.sale_price===null?'売価未登録':'売価 ¥'+r.sale_price.toLocaleString()}</p><p class="sub">${r.checked_at?'最終確認 '+h(r.checked_at.slice(0,16).replace('T',' '))+' ／ '+h(r.checked_by):'まだ入力されていません'}${!r.split_complete&&r.qty!==null?' ／ 旧記録 '+r.qty+'本換算（内訳を入力）':''}</p><div class="quantity"><label>未開封本数<input data-field="unopened" type="number" inputmode="numeric" min="0" max="1000000" step="1" placeholder="例：3" value="${r.unopened??''}" aria-label="${h(r.name)}の未開封本数"></label><label>開封残（本換算）<input data-field="opened" type="number" inputmode="decimal" min="0" max="1000000" step="0.1" placeholder="例：0.5" value="${r.opened??''}" aria-label="${h(r.name)}の開封残"></label></div><p class="sub">半分＝0.5。開封済みがなければ0。</p><button type="button" class="confirm" aria-label="${h(r.name)}の在庫を保存">この品目を保存</button><div class="saveinfo" aria-live="polite">${drafts.has(key(id))?'未保存':''}</div></article>`}
$('#cards').addEventListener('input',e=>{if(e.target.type!=='number')return;const el=e.target.closest('.card');draft(Number(el.dataset.id),e.target.dataset.field,e.target.value===''?null:Number(e.target.value));el.querySelector('.saveinfo').textContent='未保存'});
$('#cards').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b||busy)return;const id=Number(b.closest('.card').dataset.id),r=item(id);if(r.unopened===null||r.opened===null){toast('未開封本数と開封残を両方入力してください。在庫なしは0です。',true);return}draft(id,'unopened',r.unopened);await save([id])});
function actor(){const value=$('#name').value.trim();if(!value){$('#name').focus();throw Error('確認者のお名前を入力してください')}localStorage.setItem('tsukiya_supplies_name',value);return value}
async function save(ids){if(busy)return false;try{const who=actor();const selected=[...drafts.entries()].filter(([k])=>k.startsWith(branch+':')&&(!ids||ids.includes(Number(k.split(':')[1]))));if(!selected.length)return true;busy=true;dirtyText();await api('/save',{branch,actor:who,items:selected.map(([,v])=>v)});selected.forEach(([k])=>drafts.delete(k));data=await api();render();toast('在庫数を保存しました');return true}catch(e){toast(e.message,true);return false}finally{busy=false;dirtyText()}}
$('#save').onclick=()=>save();
document.querySelectorAll('[data-branch]').forEach(b=>b.onclick=()=>{if(busy)return;branch=b.dataset.branch;document.querySelectorAll('[data-branch]').forEach(x=>{x.classList.toggle('selected',x===b);x.setAttribute('aria-pressed',String(x===b))});render()});
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>{x.classList.toggle('selected',x===b);x.setAttribute('aria-pressed',String(x===b))});renderCards()});
$('#search').oninput=renderCards;
$('#report').onclick=async()=>{try{actor();if(!await save())return;busy=true;dirtyText();data=await api();render();$('#reportPreview').textContent=data.preview[branch]+'\n\n送信者：'+actor();$('#confirmReport').showModal()}catch(e){toast(e.message,true)}finally{busy=false;dirtyText()}};
$('#cancelReport').onclick=()=>$('#confirmReport').close();
$('#sendReport').onclick=async()=>{if(busy)return;busy=true;dirtyText();try{const result=await api('/report',{branch,actor:actor()});$('#confirmReport').close();toast(result.state==='accepted'?'同じ在庫内容はLINE受付済みです':result.state==='failed'?'前回の通知が失敗しています。送信状況をご確認ください':result.already_queued?'同じ在庫内容は送信待ちです':'朝倉への在庫送信を受け付けました。',result.state==='failed');data=await api();render()}catch(e){toast(e.message,true)}finally{busy=false;dirtyText()}};
$('#reload').onclick=()=>location.reload();window.addEventListener('beforeunload',e=>{if(drafts.size){e.preventDefault();e.returnValue=''}});load();
</script></body></html>
