<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f2742">
<title>西天満 つきや｜前受け管理 Tablet</title>
  <link rel="manifest" href="./manifest.json">
<style>
:root{
  --bg:#f5f3ee;--panel:#fff;--navy:#0f2742;--gold:#b28a47;
  --text:#1d2430;--muted:#6d7480;--line:#e7e1d7;
  --ok:#1f7a5a;--warn:#b8751a;--danger:#a63d40;--soft:#eef2f6
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:var(--text)}
body{padding-bottom:max(10px,env(safe-area-inset-bottom))}
header{
  background:var(--navy);color:#fff;padding:calc(15px + env(safe-area-inset-top)) 22px 15px;
  display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10
}
.brand{font-size:22px;font-weight:800;letter-spacing:.04em}.sub{font-size:11px;opacity:.72;margin-top:3px}
main{padding:16px;max-width:1440px;margin:auto}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi b{display:block;font-size:26px;color:var(--navy)}.kpi span{font-size:11px;color:var(--muted)}
.layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(330px,.85fr);gap:14px;align-items:start}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 4px 18px rgba(20,30,40,.04)}
h2{font-size:17px;color:var(--navy);margin:0 0 12px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
button{border:0;border-radius:10px;padding:10px 13px;font-weight:800;font-size:13px;cursor:pointer}
.primary{background:var(--navy);color:#fff}.gold{background:var(--gold);color:#fff}.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
.tablewrap{overflow:auto;max-height:67vh;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;min-width:860px;background:#fff}
th,td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:middle}
th{position:sticky;top:0;background:#faf9f6;color:var(--muted);font-size:11px;z-index:2}
.badge{display:inline-block;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:800}
.PENDING{background:#f1f1f1}.INVOICED{background:#fff0da;color:var(--warn)}.CONFIRMED{background:#e4f4ec;color:var(--ok)}
label{display:block;font-size:11px;color:var(--muted);margin:8px 0 4px}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;font-size:15px;background:#fff}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.log{font-size:12px;background:#faf9f6;border:1px solid var(--line);padding:10px;border-radius:10px;line-height:1.6;white-space:pre-wrap}
.side{display:grid;gap:14px}
@media(max-width:950px){
  .layout{grid-template-columns:1fr}
  .tablewrap{max-height:none}
}
</style>
</head>
<body>
<header>
  <div><div class="brand">西天満 つきや｜前受け管理</div><div class="sub">Tablet Operations Console</div></div>
  <div style="font-size:12px;opacity:.8">TableCheck / 電話予約 / Square</div>
</header>

<main>
  <section class="kpis">
    <div class="kpi"><b id="kAll">0</b><span>予約件数</span></div>
    <div class="kpi"><b id="kPending">0</b><span>決済待ち</span></div>
    <div class="kpi"><b id="kConfirmed">0</b><span>予約確定</span></div>
    <div class="kpi"><b id="kAmount">¥0</b><span>確定済前受け</span></div>
  </section>

  <section class="layout">
    <div class="card">
      <div class="toolbar">
        <button class="ghost" onclick="render()">予約一覧を更新</button>
        <button class="gold" onclick="addDemoTableCheck()">TableCheck予約を受信</button>
      </div>
      <h2>予約一覧</h2>
      <div class="tablewrap">
        <table>
          <thead>
            <tr><th>ID</th><th>経路</th><th>お客様</th><th>来店日時</th><th>人数</th><th>前受け</th><th>状態</th><th>操作</th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>

    <aside class="side">
      <div class="card">
        <h2>電話予約入力</h2>
        <div class="formgrid">
          <div><label>お客様名</label><input id="name" placeholder="例：鈴木 一郎"></div>
          <div><label>電話番号</label><input id="phone" inputmode="tel"></div>
          <div><label>メール</label><input id="email" type="email"></div>
          <div><label>人数</label><input id="party" type="number" min="1" value="2"></div>
          <div><label>来店日時</label><input id="visit" type="datetime-local"></div>
          <div><label>前受け金額</label><input id="amount" type="number" min="0" value="110000"></div>
        </div>
        <label>コース</label><input id="course" value="厳選活蟹コース">
        <div class="actions">
          <button class="primary" onclick="addPhone()">予約登録</button>
          <button class="ghost" onclick="clearForm()">クリア</button>
        </div>
        <div id="notice" class="log" style="margin-top:10px">タブレット単体で起動できます。</div>
      </div>

      <div class="card">
        <h2>自動化設定</h2>
        <label>前受け金</label>
        <select><option>コース料金 全額</option><option>50%</option><option>一律 50,000円</option></select>
        <label>支払期限</label>
        <select><option>予約受付から24時間</option><option>12時間</option><option>48時間</option></select>
        <div class="log" style="margin-top:10px">電話予約：利用可能
端末内保存：利用可能
Square実請求：本番サーバー接続待ち
TableCheck自動連携：本番サーバー接続待ち</div>
      </div>
    </aside>
  </section>
</main>

<script>
const STORE="tsukiya_tablet_v1";
let rows=[];
try{rows=JSON.parse(localStorage.getItem(STORE)||"[]")}catch(e){rows=[]}
if(!rows.length){
  rows=[
    {id:1,source:"TableCheck",name:"山田 花子",contact:"guest@example.com",visit:"2026-09-02T18:00",party:2,amount:110000,status:"CONFIRMED"},
    {id:2,source:"TableCheck",name:"佐藤 健",contact:"guest2@example.com",visit:"2026-09-03T19:00",party:2,amount:110000,status:"PENDING"}
  ];
  save();
}
const $=id=>document.getElementById(id);
function save(){localStorage.setItem(STORE,JSON.stringify(rows))}
function yen(n){return "¥"+Number(n||0).toLocaleString()}
function stateLabel(s){return s==="CONFIRMED"?"予約確定":s==="INVOICED"?"請求済":"決済待ち"}
function render(){
  $("rows").innerHTML=rows.map(r=>`<tr>
    <td>${r.id}</td><td>${r.source}</td>
    <td><b>${r.name}</b><br><small>${r.contact||""}</small></td>
    <td>${r.visit.replace("T"," ")}</td><td>${r.party}名</td><td>${yen(r.amount)}</td>
    <td><span class="badge ${r.status}">${stateLabel(r.status)}</span></td>
    <td>
      <button class="gold" onclick="invoice(${r.id})">請求済</button>
      <button class="primary" onclick="confirmR(${r.id})">確定</button>
    </td>
  </tr>`).join("");
  $("kAll").textContent=rows.length;
  $("kPending").textContent=rows.filter(r=>r.status!=="CONFIRMED").length;
  $("kConfirmed").textContent=rows.filter(r=>r.status==="CONFIRMED").length;
  $("kAmount").textContent=yen(rows.filter(r=>r.status==="CONFIRMED").reduce((s,r)=>s+Number(r.amount),0));
}
function addPhone(){
  const name=$("name").value.trim(),visit=$("visit").value;
  if(!name){$("notice").textContent="お客様名を入力してください。";return}
  if(!visit){$("notice").textContent="来店日時を入力してください。";return}
  rows.unshift({
    id:Date.now(),source:"電話",name,
    contact:$("email").value.trim()||$("phone").value.trim(),
    visit,party:Number($("party").value||2),amount:Number($("amount").value||0),status:"PENDING"
  });
  save();render();$("notice").textContent=`${name}様の電話予約を登録しました。`;
}
function addDemoTableCheck(){
  rows.unshift({id:Date.now(),source:"TableCheck",name:"新規 予約様",contact:"newguest@example.com",visit:"2026-09-06T18:00",party:2,amount:110000,status:"PENDING"});
  save();render();$("notice").textContent="TableCheck予約を受信しました（テスト）。";
}
function invoice(id){const r=rows.find(x=>x.id===id);if(r){r.status="INVOICED";save();render()}}
function confirmR(id){const r=rows.find(x=>x.id===id);if(r){r.status="CONFIRMED";save();render()}}
function clearForm(){["name","phone","email"].forEach(id=>$(id).value="")}
(function(){
  const d=new Date();d.setDate(d.getDate()+1);
  const p=n=>String(n).padStart(2,"0");
  $("visit").value=`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T18:30`;
  render();
})();
</script>
</body>
</html>
