services:
  - type: web
    name: tsukiya-reservation
    runtime: python
    plan: 0.5c-512mb
    buildCommand: "echo 'No external Python packages required'"
    startCommand: "python3 run.py"
    healthCheckPath: /health
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_TOKEN
        generateValue: true
      - key: APP_BASE_URL
        sync: false
      - key: COUNTER_CAPACITY
        value: "8"
      - key: SQUARE_ENV
        value: production
      - key: SQUARE_API_VERSION
        value: "2026-08-19"
      - key: SQUARE_ACCESS_TOKEN
        sync: false
      - key: SQUARE_LOCATION_ID
        sync: false
      - key: SQUARE_WEBHOOK_SIGNATURE_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
    disk:
      name: tsukiya-data
      mountPath: /var/data
      sizeGB: 1
